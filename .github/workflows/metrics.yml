name: Profile metrics

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Find qualifying upstream repositories
        id: upstream
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const login = context.repo.owner;
            const query = `is:pr author:${login} is:closed label:merged`;
            const result = await github.rest.search.issuesAndPullRequests({
              q: query,
              per_page: 100,
            });
            const repositories = new Map();
            for (const item of result.data.items) {
              const fullName = new URL(item.repository_url).pathname.slice(1);
              if (!repositories.has(fullName)) {
                const { data } = await github.rest.repos.get({
                  owner: fullName.split("/")[0],
                  repo: fullName.split("/")[1],
                });
                repositories.set(fullName, { stars: data.stargazers_count, count: 0 });
              }
              repositories.get(fullName).count += 1;
            }
            const selected = [...repositories.entries()]
              .filter(([, value]) => value.stars > 100)
              .sort((a, b) => b[1].count - a[1].count || b[1].stars - a[1].stars)
              .slice(0, 10)
              .map(([name]) => name);
            core.setOutput("repositories", selected.join(","));

      - name: General activity and notable contributions
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header, activity, community, repositories, metadata
          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes
          plugin_followup: yes
          plugin_followup_sections: user

      - name: Featured upstream repository cards
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: upstream-repositories.svg
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: ${{ steps.upstream.outputs.repositories }}
