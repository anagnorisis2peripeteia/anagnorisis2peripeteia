name: Profile metrics

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Find qualifying upstream repositories
        id: upstream
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const login = context.repo.owner;
            const queries = [`is:pr author:${login} is:merged`, `is:pr author:${login} is:closed label:merged`];
            const matches = new Map();
            for (const query of queries) {
              const { data } = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 100 });
              for (const item of data.items) matches.set(item.id, item);
            }
            const repositories = new Map();
            for (const item of matches.values()) {
              const fullName = new URL(item.repository_url).pathname
                .replace(/^\/repos\//, "");
              const [owner, repo] = fullName.split("/");
              if (owner.toLowerCase() === login.toLowerCase()) continue;
              if (!repositories.has(fullName)) {
                const { data } = await github.rest.repos.get({
                  owner, repo,
                });
                repositories.set(fullName, { stars: data.stargazers_count, language: data.language, topics: (data.topics || []).slice(0, 2), count: 0 });
              }
              repositories.get(fullName).count += 1;
            }
            const selected = [...repositories.entries()]
              .sort((a, b) => b[1].count - a[1].count || b[1].stars - a[1].stars)
              .slice(0, 10)
              .map(([name, value]) => ({ name, ...value }));
            const escape = (value) => String(value).replace(/[&<>"']/g, (char) => ({
              "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;",
            })[char]);
            const rows = selected.map((repository, index) => {
              const y = 112 + index * 82;
              const title = repository.name.length > 46
                ? `${repository.name.slice(0, 43)}...`
                : repository.name;
              const tags = [repository.language, `★ ${repository.stars.toLocaleString()}`, ...repository.topics].filter(Boolean).slice(0, 4);
              const tagText = tags.join("  ·  ");
              return `<a href="https://github.com/${escape(repository.name)}"><text x="24" y="${y}" fill="#0366d6" font-size="18" font-weight="600">${escape(title)}</text><text x="736" y="${y}" fill="#24292f" font-size="16" font-weight="600" text-anchor="end">${repository.count} Merged</text><text x="24" y="${y + 24}" fill="#586069" font-size="13">${escape(tagText)}</text><path d="M24 ${y + 42}H736" stroke="#e1e4e8"/></a>`;
            }).join("");
            const height = 142 + selected.length * 82;
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="760" height="${height}" viewBox="0 0 760 ${height}" role="img"><text x="24" y="38" fill="#24292f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="22" font-weight="600">Repository contributions</text><text x="24" y="64" fill="#586069" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14">External repositories, ranked by accepted pull requests</text><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">${rows || '<text x="24" y="112" fill="#586069" font-size="15">No qualifying pull requests found yet.</text>'}</g></svg>`;
            const path = "upstream-contributions.svg";
            let existing;
            try {
              existing = await github.rest.repos.getContent({ ...context.repo, path });
              if (Buffer.from(existing.data.content, "base64").toString("utf8") === svg) return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path,
              message: "Refresh upstream pull-request contributions",
              content: Buffer.from(svg).toString("base64"),
              ...(existing && { sha: existing.data.sha }),
            });
